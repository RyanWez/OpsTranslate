# fly.toml app configuration file for OpsTranslate

app = "opstranslate"
primary_region = "sin"

[build]

[deploy]
  release_command = "sh -c 'if [ -n \"$DATABASE_URL\" ]; then alembic upgrade head && python -m app.store.seed; fi'"

[env]
  PORT = "8000"
  MODE = "polling"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
